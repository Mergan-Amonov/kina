name = "anki-bot"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "anki-db"
database_id = "5ed16095-9f25-45fa-88b9-cac3dc54895d"

[triggers]
crons = ["*/15 * * * *"]

